[kafka]
topic = retail_stream
bootstrap_servers = localhost:9092
csv_filepath = ./data/OnlineRetail.csv
auto_offset_reset = latest
group_id = retail-streaming-group

[postgresql]
postgresql_host = localhost
postgresql_port = 5432
postgresql_database = retail_db
postgresql_table = retail_transactions
postgresql_url = jdbc:postgresql://localhost:5432/retail_db
postgresql_driver = org.postgresql.Driver
postgresql_user = postgres
postgresql_pwd = postgrespassword

[spark]
app_name = RetailRealTimeStreamingPipeline
checkpoint_dir = temp/checkpoints/retail_stream
trigger_processing_time = 2 seconds
