# ==============================================================================
# KONFIGURASI TERPUSAT PIPELINE STREAMING (config.ini)
# ==============================================================================
# Berkas konfigurasi ini menyimpan parameter bawaan (default) sistem.
# Siswa dapat mengubah nilai di sini untuk pengujian lokal (non-Docker).
# Jika menggunakan Docker, nilai di file ini akan otomatis diselaraskan oleh
# environment variable di file docker-compose.yml.
# ==============================================================================

[kafka]
# Nama antrean / saluran topik pesan di Apache Kafka
topic = retail_stream

# Alamat broker Kafka saat diakses dari host lokal
bootstrap_servers = localhost:9092

# Lokasi berkas data CSV yang menjadi sumber simulasi transaksi
csv_filepath = ./data/OnlineRetail.csv

# Posisi pembacaan awal stream Kafka: 'latest' (hanya pesan baru) atau 'earliest' (dari awal topik)
auto_offset_reset = latest

# ID grup consumer untuk koordinasi pembagian beban pesan di Kafka
group_id = retail-streaming-group

[postgresql]
# Alamat host server database PostgreSQL
postgresql_host = localhost

# Port jaringan PostgreSQL di mesin host
postgresql_port = 5432

# Nama database target
postgresql_database = retail_db

# Nama tabel tempat menyimpan hasil streaming
postgresql_table = retail_transactions

# String koneksi JDBC lengkap yang digunakan oleh Spark
postgresql_url = jdbc:postgresql://localhost:5432/retail_db

# Nama kelas driver JDBC resmi untuk PostgreSQL
postgresql_driver = org.postgresql.Driver

# Nama pengguna (username) administrator database
postgresql_user = postgres

# Kata sandi (password) database
postgresql_pwd = postgrespassword

[spark]
# Nama aplikasi PySpark yang akan tampil pada Web UI Spark
app_name = RetailRealTimeStreamingPipeline

# Folder penyimpanan catatan offset Kafka untuk menjamin ketahanan terhadap kegagalan (checkpointing)
checkpoint_dir = temp/checkpoints/retail_stream

# Interval waktu evaluasi micro-batch Spark (memproses data baru setiap 2 detik)
trigger_processing_time = 2 seconds
